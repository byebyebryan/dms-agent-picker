name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.16.2
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check .
      - run: shellcheck install.sh
